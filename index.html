<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frank Bird | Author</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      color: #f1f3f4;
      background-color: #07131a;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* MAIN PAGE */

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 50% 50%;

      background:
        linear-gradient(
          rgba(7, 19, 26, 0.48),
          rgba(7, 19, 26, 0.68)
        ),
        url("images/sea.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* BOOK COVER */

    .cover-panel {
      min-height: 100vh;

      background:
        url("cover.png")
        right center / 85% auto
        no-repeat;
    }


    /* INFORMATION PANEL */

    .info-panel {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px;
    }


    .content {
      width: 100%;
      max-width: 560px;
    }


    /* AUTHOR NAME */

    h1 {
      margin: 0;

      font-size: 3.6rem;
      font-weight: normal;
      letter-spacing: 0.12em;
    }


    .author {
      margin-top: 8px;

      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 0.9rem;

      opacity: 0.75;
    }


    /* DIVIDER */

    .divider {
      width: 80px;
      height: 1px;

      background: #8a9499;

      margin: 45px 0;
    }


    /* BOOK TITLE */

    h2 {
      margin: 0;

      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.04em;
    }


    .novel {
      margin-top: 8px;

      font-style: italic;

      opacity: 0.7;
    }


    /* TAGLINE */

    .tagline {
      margin-top: 32px;

      font-size: 1.25rem;
      line-height: 1.6;
    }


    /* COMING SOON */

    .coming-soon {
      margin-top: 50px;

      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }


    /* CONTACT */

    .contact {
      margin-top: 70px;

      font-size: 0.9rem;

      opacity: 0.8;
    }


    .contact a {
      color: inherit;
      text-decoration: none;
    }


    .contact a:hover {
      text-decoration: underline;
    }


    /* REVISION NUMBER */

    .revision {
      position: fixed;

      bottom: 8px;
      right: 10px;

      font-size: 0.65rem;
      color: #899399;
      letter-spacing: 0.05em;

      opacity: 0.7;
    }


    /* MOBILE */

    @media (max-width: 800px) {

      .page {
  display: block;

  background:
    linear-gradient(
      rgba(7, 19, 26, 0.58),
      rgba(7, 19, 26, 0.78)
    ),
    url("images/sea.jpg");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}


      .cover-panel {
        min-height: 0;

        aspect-ratio: 2 / 3;

        background-size: contain;
        background-position: center;
      }


      .info-panel h1,
      .info-panel .author,
      .info-panel .divider {
        display: none;
      }


      .info-panel {
        min-height: auto;

        padding: 35px 28px 45px;
      }


      h2 {
        font-size: 1.6rem;
      }


      .tagline {
        font-size: 1.1rem;
      }

    }

  </style>

</head>


<body>

  <main class="page">


    <section class="cover-panel">
    </section>


    <section class="info-panel">

      <div class="content">

        <h1>FRANK BIRD</h1>

        <div class="author">
          Author
        </div>

        <div class="divider"></div>


        <h2>Water Water Everywhere...</h2>

        <div class="novel">
          A novel
        </div>


        <div class="tagline">
          Yes, it is everywhere.<br>
          But what happens if you can't trust it?
        </div>


        <div class="coming-soon">
          Coming Soon
        </div>


        <div class="contact">

          <a href="mailto:contact@frankbirdauthor.co.uk">
            contact@frankbirdauthor.co.uk
          </a>

        </div>

      </div>

    </section>

  </main>


  <div class="revision">
    Revision 08....
  </div>


</body>

</html>
